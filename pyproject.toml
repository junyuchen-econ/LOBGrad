[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lobgrad"
version = "0.1.0"
description = "LOBGrad: joint diffusion modeling for limit order book forecasting"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "optuna>=3.4",
    "tqdm>=4.65",
    "PyYAML>=6.0",
    "seaborn>=0.12",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "nbstripout",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["lobgrad*"]
exclude = ["tests*", "scripts*", "notebooks*"]
